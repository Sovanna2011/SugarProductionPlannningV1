<title>Sugar Production Planning — testing prototype</title>

<style>
/* ─────────────────────────────────────────────────────────────────────
   Tokens. Light is the bare :root; dark is redefined twice so it wins
   whether the viewer set nothing (OS preference) or chose explicitly.
   ───────────────────────────────────────────────────────────────────── */
:root {
  /* Cool steel neutrals — a blue-biased grey, not a default mid-grey. */
  --ground:      #eef1f4;
  --surface:     #ffffff;
  --surface-2:   #f6f8fa;
  --line:        #d6dce3;
  --line-strong: #b9c2cc;
  --ink:         #161c22;
  --ink-2:       #46525e;
  --ink-3:       #6f7d8a;

  /* Process teal — deliberately clear of the traffic-light hues. */
  --accent:      #0b5563;
  --accent-ink:  #ffffff;
  --accent-soft: #dcecef;
  --accent-line: #8fbdc6;

  /* Semantic, owned by capacity and variance only. */
  --good:        #1f7a4d;
  --good-soft:   #dff0e6;
  --warn:        #8f6410;
  --warn-soft:   #f8ecd3;
  --bad:         #a83232;
  --bad-soft:    #f8dede;

  --shadow: 0 1px 2px rgba(16,28,34,.06), 0 8px 24px -12px rgba(16,28,34,.18);

  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:  ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #10151a;
    --surface:     #171e25;
    --surface-2:   #1e262e;
    --line:        #2c363f;
    --line-strong: #3d4954;
    --ink:         #e6ebf0;
    --ink-2:       #a8b5c0;
    --ink-3:       #7d8b97;

    --accent:      #5ec5d6;
    --accent-ink:  #08262d;
    --accent-soft: #14323a;
    --accent-line: #2c5b66;

    --good:        #5cc98d;
    --good-soft:   #14301f;
    --warn:        #e0ad4e;
    --warn-soft:   #33260c;
    --bad:         #ef7a7a;
    --bad-soft:    #351a1a;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}

:root[data-theme="dark"] {
  --ground:      #10151a;
  --surface:     #171e25;
  --surface-2:   #1e262e;
  --line:        #2c363f;
  --line-strong: #3d4954;
  --ink:         #e6ebf0;
  --ink-2:       #a8b5c0;

  --good-soft:   #14301f;
  --warn:        #e0ad4e;
  --warn-soft:   #33260c;
  --bad:         #ef7a7a;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: var(--serif); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 1.5rem; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.eyebrow {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .1em;
  font-weight: 600; color: var(--ink-3);
}

button, input, select { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ── banner ─────────────────────────────────────────────────────────── */

.banner {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: .7rem 1.25rem;
  display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap;
  font-size: .82rem; color: var(--ink-2);
}
.banner strong { color: var(--ink); font-weight: 600; }
.banner .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: inline-block; }

/* ── shell ──────────────────────────────────────────────────────────── */

.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } }

.rail {
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 1.1rem .8rem;
  display: flex; flex-direction: column; gap: 1.25rem;
}
@media (max-width: 900px) { .rail { border-right: none; border-bottom: 1px solid var(--line); } }

.brand { display: flex; flex-direction: column; gap: .15rem; padding: 0 .45rem; }
.brand .name { font-family: var(--serif); font-size: 1.02rem; font-weight: 600; line-height: 1.25; }
.brand .sub { font-size: .7rem; color: var(--ink-3); }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button {
  text-align: left; background: none; border: 0; cursor: pointer;
  padding: .5rem .55rem; border-radius: 5px; color: var(--ink-2);
  font-size: .88rem; display: flex; justify-content: space-between; gap: .5rem;
}
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .tag {
  font-size: .62rem; font-family: var(--mono); color: var(--ink-3);
  background: var(--surface-2); border: 1px solid var(--line);

}

.whoami {
  margin-top: auto; border-top: 1px solid var(--line); padding-top: .8rem;
  display: flex; flex-direction: column; gap: .5rem;
}
.whoami .who { font-size: .8rem; }
.whoami .who b { display: block; }
.whoami .who span { color: var(--ink-3); font-size: .74rem; }

/* ── main ───────────────────────────────────────────────────────────── */

.main { padding: 1.5rem 1.6rem 3rem; max-width: 1180px; min-width: 0; }
@media (max-width: 640px) { .main { padding: 1.1rem .9rem 2.5rem; } }

.screen-head { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1.1rem; }
.screen-head p { margin: 0; color: var(--ink-2); font-size: .9rem; max-width: 68ch; }

/* The per-screen company bar — the architectural point made visible. */
.companybar {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 6px; padding: .7rem .85rem; margin-bottom: 1.1rem;
  display: flex; gap: .9rem; align-items: center; flex-wrap: wrap;
}
.companybar .lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; color: var(--ink-3); }
.companybar .note { font-size: .76rem; color: var(--ink-3); margin-left: auto; max-width: 40ch; }

select, input[type="text"], input[type="number"] {
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 5px; padding: .35rem .5rem; color: var(--ink);
}

.btn {
  background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink);
  border-radius: 5px; padding: .4rem .75rem; cursor: pointer; font-size: .85rem;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }

/* ── cards, tables ──────────────────────────────────────────────────── */

.card {
  min-width: 0;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 7px; box-shadow: var(--shadow); overflow: hidden;
}
.card > header {
  padding: .7rem .9rem; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  background: var(--surface-2);
}
.card > .body { padding: .9rem; }

.stack { display: flex; flex-direction: column; gap: 1.1rem; }
.row { display: flex; gap: .55rem; align-items: center; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: .7rem; }
.kpi {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 7px; padding: .7rem .8rem;
  display: flex; flex-direction: column; gap: .2rem;
}
.kpi .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1.28rem; font-weight: 600; }
.kpi .u { font-size: .72rem; color: var(--ink-3); }

.scroll { overflow-x: auto; max-width: 100%; }

table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: .45rem .6rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-3); font-weight: 600; background: var(--surface-2);
  position: sticky; top: 0;
}
tbody tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--line-strong); }

/* ── state chips ────────────────────────────────────────────────────── */

.chip {
  display: inline-flex; align-items: center; gap: .3rem;
  font-size: .7rem; font-weight: 600; letter-spacing: .03em;
  padding: .12rem .45rem; border-radius: 4px; border: 1px solid transparent;
  white-space: nowrap;
}
.chip.good { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.chip.bad  { background: var(--bad-soft);  color: var(--bad);  border-color: var(--bad); }
.chip.mute { background: var(--surface-2); color: var(--ink-3); border-color: var(--line-strong); }
.chip.info { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }

/* Capacity meter — form as well as number. */
.meter { display: flex; align-items: center; gap: .5rem; min-width: 190px; }
.meter .track {
  flex: 1; height: 7px; border-radius: 4px; background: var(--surface-2);
  border: 1px solid var(--line); overflow: hidden; position: relative;
}
.meter .fill { height: 100%; }
.meter .fill.good { background: var(--good); }
.meter .fill.warn { background: var(--warn); }
.meter .fill.bad  { background: var(--bad); }
.meter .val { font-family: var(--mono); font-size: .76rem; min-width: 62px; text-align: right; }

/* matrix cells */
.matrix input {
  width: 100%; min-width: 74px; text-align: right;
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .84rem;
  padding: .25rem .35rem;
}
.matrix input:disabled { background: var(--surface-2); color: var(--ink-3); }

/* ── messages ───────────────────────────────────────────────────────── */

.msg {
  border-radius: 6px; padding: .6rem .8rem; font-size: .85rem;
  border: 1px solid; display: flex; gap: .55rem; align-items: flex-start;
}
.msg .code { font-family: var(--mono); font-size: .75rem; font-weight: 700; flex: none; padding-top: .06rem; }
.msg.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.msg.bad  { background: var(--bad-soft);  border-color: var(--bad);  color: var(--bad); }
.msg.info { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }

.log { display: flex; flex-direction: column; gap: .45rem; }

/* ── sign-in ────────────────────────────────────────────────────────── */

.signin { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
.signin .panel { width: min(560px, 100%); }
.userpick { display: grid; gap: .5rem; }
.userpick button {
  display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center;
  text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: .65rem .8rem; cursor: pointer;
}
.userpick button:hover { border-color: var(--accent); }
.userpick .u { font-weight: 600; }
.userpick .r { font-size: .76rem; color: var(--ink-3); }

.hint { font-size: .8rem; color: var(--ink-3); }
.hint code { font-family: var(--mono); font-size: .92em; background: var(--surface-2); padding: 0 .25rem; border-radius: 3px; }

/* Tabs inside a screen — the cane and master-data screens hold more than
   one table's worth of thing, and a tab is cheaper than a fifth rail entry. */
.tabs { display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button {
  flex: 1; padding: .55rem .8rem; background: var(--surface); border: 0; cursor: pointer;
  font: inherit; font-size: .85rem; color: var(--ink-2);
}
.tabs button:hover { background: var(--surface-2); color: var(--ink); }
.tabs button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.gridhead { margin: 0 0 .5rem; font-size: .85rem; font-weight: 600; letter-spacing: .01em; }

/* A number that does not exist reads as absent, never as zero. */
.na { color: var(--ink-3); font-style: italic; }

.mono { font-family: var(--mono); font-size: .85em; }
.btn.small { padding: .2rem .5rem; font-size: .75rem; }

td.n.good { color: var(--good); }
td.n.warn { color: var(--warn); }
td.n.bad  { color: var(--bad); }

ul.tight { margin: .35rem 0 0; padding-left: 1.1rem; }
ul.tight li { margin-bottom: .25rem; font-size: .85rem; color: var(--ink-2); }

.footnote { margin-top: 2rem; font-size: .8rem; color: var(--ink-3); max-width: 70ch; }
.footnote b { color: var(--ink-2); }
</style>

<script>
"use strict";
/* ═════════════════════════════════════════════════════════════════════
   A browser-side model of the Sugar Production Planning system.

   This is a prototype for user testing: the screens and the business
   rules mirror the real service, but nothing here talks to it. The rules
   below are ported from the Go implementation so that what a tester sees
   refused is what the real server refuses.
   ═════════════════════════════════════════════════════════════════════ */

const fmt = new Intl.NumberFormat(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const pct = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const q   = v => fmt.format(Math.round(v));

const iso = d => d.toISOString().slice(0, 10);
const dayOffset = n => { const d = new Date(); d.setUTCHours(0,0,0,0); d.setUTCDate(d.getUTCDate() + n); return d; };
const DAYS = [-2,-1,0,1,2,3,4].map(dayOffset);
const DATES = DAYS.map(iso);
const TODAY = iso(dayOffset(0));

/* ── master data ─────────────────────────────────────────────────── */

const COMPANIES = [
  { id: 1, code: "1000", name: "Sugar Mill Main Plant" },
  { id: 2, code: "2000", name: "Sugar Mill North" },
  { id: 3, code: "3000", name: "Sugar Refinery Export" },
];

const MATERIALS = [
  { id: 7, code: "RAW_SUGAR",  name: "Raw Sugar",     conditioning: false, stock: true  },
  { id: 6, code: "MOLASSES",   name: "Molasses",      conditioning: false, stock: true  },
  { id: 5, code: "BAGASSE",    name: "Bagasse",       conditioning: false, stock: true  },
  { id: 3, code: "REFINED",    name: "Refined Sugar", conditioning: true,  stock: true  },
  { id: 2, code: "SUPER_REF",  name: "Super Refined", conditioning: true,  stock: true  },
  { id: 1, code: "WHITE",      name: "White Sugar",   conditioning: false, stock: true  },
  { id: 9, code: "ELECTRICITY",name: "Electricity",   conditioning: false, stock: false },
  { id: 8, code: "SUGARCANE",  name: "Sugarcane",     conditioning: false, stock: true  },
];
const mat = id => MATERIALS.find(m => m.id === id);
const matByCode = c => MATERIALS.find(m => m.code === c);

/* Storage locations. A null capacity means unlimited — never zero. */
const WAREHOUSES = [
  { id:1,  code:"MT1",     name:"Molasses Tank 1",       type:"TANK",               capacity:5000,  allows:["MOLASSES"] },
  { id:2,  code:"MT2",     name:"Molasses Tank 2",       type:"TANK",               capacity:5000,  allows:["MOLASSES"] },
  { id:3,  code:"MT3",     name:"Molasses Tank 3",       type:"TANK",               capacity:3000,  allows:["MOLASSES"] },
  { id:4,  code:"RW1",     name:"Raw Sugar Warehouse 1", type:"WAREHOUSE",          capacity:20000, allows:["RAW_SUGAR"] },
  { id:5,  code:"RW2",     name:"Raw Sugar Warehouse 2", type:"WAREHOUSE",          capacity:15000, allows:["RAW_SUGAR"] },
  { id:6,  code:"SILO1",   name:"Condition Silo 1",      type:"SILO",               capacity:3000,  allows:["REFINED","SUPER_REF"] },
  { id:7,  code:"SW1",     name:"Sugar Warehouse 1",     type:"WAREHOUSE",          capacity:10000, allows:["REFINED"] },
  { id:8,  code:"SW2",     name:"Sugar Warehouse 2",     type:"WAREHOUSE",          capacity:10000, allows:["WHITE"] },
  { id:9,  code:"SW3",     name:"Sugar Warehouse 3",     type:"WAREHOUSE",          capacity:8000,  allows:["SUPER_REF"] },
  { id:10, code:"BAGYARD", name:"Bagasse Yard",          type:"PRODUCTION_STORAGE", capacity:null,  allows:["BAGASSE"] },
  { id:11, code:"CANEYARD", name:"Cane Yard",             type:"PRODUCTION_STORAGE", capacity:12000, allows:["SUGARCANE"] },
];
const wh = id => WAREHOUSES.find(w => w.id === id);

const LINES = [
  { id:1, code:"LINE1", name:"Mill Line 1" },
  { id:2, code:"LINE2", name:"Mill Line 2" },
  { id:3, code:"LINE3", name:"Refinery Line 1" },
  { id:4, code:"LINE4", name:"Refinery Line 2" },
  { id:5, code:"LINE5", name:"Packing Line 1" },
];
const line = id => LINES.find(l => l.id === id);

/* Process network. requiresConditioning on an output is what forces a
   grade through the silo — the rule is data, not code. */
const PROCESSES = [
  { id:1, code:"MILLING",  name:"Milling",
    io:[["SUGARCANE","INPUT",false],["RAW_SUGAR","OUTPUT",false],["MOLASSES","OUTPUT",false],["BAGASSE","OUTPUT",false]] },
  { id:2, code:"POWER",    name:"Power Plant",
    io:[["BAGASSE","INPUT",false],["ELECTRICITY","OUTPUT",false]] },
  { id:4, code:"REFINING", name:"Refining",
    io:[["REFINED","OUTPUT",true],["SUPER_REF","OUTPUT",true],["WHITE","OUTPUT",false]] },
  { id:6, code:"PACKING",  name:"Packing",
    io:[["REFINED","INPUT",false],["WHITE","INPUT",false],["REFINED","OUTPUT",false],["WHITE","OUTPUT",false]] },
];
const proc = id => PROCESSES.find(p => p.id === id);

const MOVEMENT_TYPES = [
  { id:2, code:"PRODUCTION_RECEIPT", name:"Production Receipt", dir:"IN"  },
  { id:3, code:"PRODUCTION_ISSUE",   name:"Production Issue",   dir:"OUT" },
  { id:4, code:"REMELT_ISSUE",       name:"Remelt Issue",       dir:"OUT" },
  { id:7, code:"SALE",               name:"Sale",               dir:"OUT" },
];
const mvt = id => MOVEMENT_TYPES.find(m => m.id === id);

/* ── cane supply: where the cane comes from ────────────────────────── */

/* Own-estate cane and purchased cane are planned in the same grid and
   reported apart: only purchased cane carries a contract and a price, so
   only purchased cane has a value to report. */
const GROWERS = [
  { id:1, companyId:1, code:"EST-01", name:"Company Estate North",       type:"ESTATE",     supply:"OWN_ESTATE", zone:"North", price:null,  currency:null,  contract:null  },
  { id:2, companyId:1, code:"EST-02", name:"Company Estate River",       type:"ESTATE",     supply:"OWN_ESTATE", zone:"River", price:null,  currency:null,  contract:null  },
  { id:3, companyId:1, code:"OG-101", name:"Sok Thida Farm",             type:"OUT_GROWER", supply:"PURCHASED",  zone:"North", price:31.50, currency:"USD", contract:18000 },
  { id:4, companyId:1, code:"OG-102", name:"Chan Dara Plantation",       type:"OUT_GROWER", supply:"PURCHASED",  zone:"East",  price:32.25, currency:"USD", contract:24000 },
  { id:5, companyId:1, code:"OG-103", name:"Mekong Smallholder Group",   type:"OUT_GROWER", supply:"PURCHASED",  zone:"River", price:30.00, currency:"USD", contract:9000  },
  { id:6, companyId:1, code:"CT-201", name:"Angkor Harvest Contractors", type:"CONTRACTOR", supply:"PURCHASED",  zone:"South", price:33.75, currency:"USD", contract:12000 },
  { id:7, companyId:2, code:"EST-01", name:"North Plant Estate",         type:"ESTATE",     supply:"OWN_ESTATE", zone:"Plant", price:null,  currency:null,  contract:null  },
  { id:8, companyId:2, code:"OG-101", name:"Battambang Cane Co-op",      type:"OUT_GROWER", supply:"PURCHASED",  zone:"West",  price:30.50, currency:"USD", contract:15000 },
];
const grower = id => GROWERS.find(g => g.id === id);
const growersIn = companyId => GROWERS.filter(g => g.companyId === companyId);

const VARIETIES = [
  { id:1, code:"K88-92",  name:"Khon Kaen 88-92", ccs:13.80 },
  { id:2, code:"KPS01",   name:"Kasetsart 01",    ccs:14.60 },
  { id:3, code:"LK92-11", name:"Lam Kok 92-11",   ccs:12.90 },
];

/* Area × expected yield. A field with no yield history has an unknown
   estimate — absent, not zero. */
const FIELDS = [
  { id:1, companyId:1, growerId:1, code:"FLD-001", name:"North Block A",     area:120.0, yield:78.0, cycle:"PLANT",    variety:1 },
  { id:2, companyId:1, growerId:1, code:"FLD-002", name:"North Block B",     area:95.5,  yield:82.0, cycle:"RATOON_1", variety:2 },

const swing = i => 95 + ((i * 7) % 11);
function planSeries(base) { return DATES.map((d, i) => Math.round(base * swing(i) / 100)); }

function seedPlanItems() {
  const items = {};                    // key `${date}|${line}|${material}` → qty
  const put = (matCode, lineId, base) =>
    planSeries(base).forEach((v, i) => { items[`${DATES[i]}|${lineId}|${matCode}`] = v; });

  put("RAW_SUGAR", 1, 3700); put("RAW_SUGAR", 2, 2500);
  put("MOLASSES",  1, 1350);
  put("BAGASSE",   1, 1600);
  put("REFINED",   3, 1900);
  put("WHITE",     3, 660);
  return items;
}

/* The mill needs about 6 200 t of cane a day; six growers supply it. */
const HARVEST_BASE = { 1:1500, 2:1200, 3:1100, 4:1300, 5:500, 6:600 };

function seedHarvest() {
  const items = {};
  Object.entries(HARVEST_BASE).forEach(([growerId, base]) => {
    planSeries(base).forEach((v, i) => { items[`${DATES[i]}|${growerId}`] = v; });
  });
  return items;
}

/* Three days of tickets. A ticket here stands for a consolidated day-lot:
   a real yard weighs hundreds of loads a day. */
function seedDeliveries() {
  const rows = [];
  let n = 1;
  [0, 1, 2].forEach(dayIndex => {
    Object.entries(HARVEST_BASE).forEach(([growerId, base]) => {
      const g = grower(Number(growerId));
      /* Three lots a day per grower, which is what brings the delivered
         tonnage up to the planned tonnage. One lot per grower would make the
         variance a statement about how much demo data there was patience for
         rather than about the campaign. */
      [1, 2, 3].forEach(lot => {
        rows.push({
          no: `CANE-1000-2026-${String(n++).padStart(6, "0")}`,
          date: DATES[dayIndex], growerId: g.id, vehicle: `1AB-23${40 + lot}`,
          /* the same arithmetic the seed script uses, so the prototype and a
             seeded instance show the same variance */
          gross: Math.round(base / 3) + lot * 7 + (dayIndex - 2) * 3, tare: 14, ccs: 13.4,
          status: "POSTED",
          /* The price is copied from the contract at ticket time, so
             re-negotiating it cannot rewrite what this load was worth. */
          price: g.price, currency: g.currency,
        });
      });
    });
  });
  rows.push({
    no: `CANE-1000-2026-${String(n++).padStart(6, "0")}`,
    date: DATES[2], growerId: 4, vehicle: "2CD-9911",
    gross: 435, tare: 14, ccs: 14.0, status: "DRAFT",
    price: grower(4).price, currency: grower(4).currency,
  });
  return rows;
}

/* ── the business rules, ported from the service layer ─────────────── */

/* §F6. A percentage only exists when there is a plan to compare against. */
function variancePercent(plan, actual) {
  if (plan !== 0) return (actual - plan) / Math.abs(plan) * 100;
  if (actual === 0) return 0;
  return null;                                   // rendered "n/a", never 0
}

/* §F5. No capacity means unlimited — not zero, not infinite. */
function capacityOf(w) {
  const held = stockInWarehouse(w.id);
  if (w.capacity === null || w.capacity <= 0) return { held, utilisation: null, light: "NONE" };
  const u = held / w.capacity * 100;
  return { held, utilisation: u, light: u > 90 ? "RED" : u >= 70 ? "AMBER" : "GREEN" };
}

/* §F3. The one definition of the status machine. */
const TRANSITIONS = {
  DRAFT:     ["SUBMITTED","CANCELLED"],
  SUBMITTED: ["APPROVED","DRAFT","CANCELLED"],
  APPROVED:  ["LOCKED","CANCELLED"],
  LOCKED:    [], CANCELLED: [],
};
const editableStatus = s => s === "DRAFT" || s === "SUBMITTED";

/* §F4 and §F7, in the order the service applies them. */
function validatePosting({ materialCode, warehouseId, movementTypeId, processId, quantity }) {
  const m = matByCode(materialCode);
  const w = wh(warehouseId);
  const t = mvt(movementTypeId);
  const p = processId ? proc(processId) : null;

  if (!(quantity > 0))
    return { code:"E-VAL-001", text:"A movement quantity must be greater than zero." };

  if (!m.stock)
    return { code:"E-INV-014", text:`${m.name} is produced but never held as stock, so it cannot be posted into ${w.code}.` };

  if (w.allows.length && !w.allows.includes(materialCode))
    return { code:"E-INV-015", text:`${w.code} only accepts ${w.allows.join(", ")}. ${m.name} is not allowed there.` };

  if (p) {
    const declared = p.io.find(([code]) => code === materialCode);
    if (!declared)
      return { code:"E-PROD-020", text:`${m.name} is not a declared input or output of ${p.name}.` };

    const [, ioType, needsConditioning] = declared;
    if (t.dir === "IN" && ioType === "OUTPUT" && needsConditioning && w.type !== "SILO")
      return { code:"E-PROD-022", text:`${m.name} must be received into a conditioning silo before it can reach ${w.code}.` };
  }

  if (t.dir === "IN" && w.type === "SILO" && !m.conditioning)
    return { code:"E-PROD-021", text:`${m.name} needs no conditioning and must never enter the silo — it goes direct to its warehouse.` };

  const delta = t.dir === "IN" ? quantity : -quantity;
  if (stockOf(warehouseId, materialCode) + delta < 0)
    return { code:"E-INV-011", text:`${w.code} holds ${q(stockOf(warehouseId, materialCode))} t of ${m.name}; issuing ${q(quantity)} t would take it negative.` };

  if (t.dir === "IN" && w.capacity !== null && stockInWarehouse(warehouseId) + quantity > w.capacity)
    return { code:"E-INV-012", text:`${w.code} holds ${q(stockInWarehouse(warehouseId))} t against a capacity of ${q(w.capacity)} t; ${q(quantity)} t more would overflow it.` };

  return null;
}

/* Planned harvest against what the bridge weighed, split the way the cane is
   bought: own estate and purchased are the two things a mill accounts for
   separately. */
function caneReportCard(companyId) {
  const growers = growersIn(companyId);
  const window = DATES.slice(0, 3);           // the three days already delivered

  const groups = ["OWN_ESTATE", "PURCHASED"].map(supply => {
    const ids = growers.filter(g => g.supply === supply).map(g => g.id);
    const plan = window.reduce((t, d) =>
      t + ids.reduce((u, id) => u + (Number(state.harvest[`${d}|${id}`]) || 0), 0), 0);
    const rows = state.deliveries.filter(t =>
      t.status === "POSTED" && window.includes(t.date) && ids.includes(t.growerId));
    const actual = rows.reduce((t, r) => t + netTons(r), 0);
    // One unpriced load makes the group's value unknown rather than understated.
    const value = rows.some(r => r.price === null) ? null
      : rows.reduce((t, r) => t + netTons(r) * r.price, 0);
    return { supply, plan, actual, value, variance: variancePercent(plan, actual), tickets: rows.length };
  });

  return `
  <div class="card">
    <header><h3>Planned harvest against what the bridge weighed</h3></header>
    <div class="body scroll">
      <table>
        <thead><tr><th>Supply</th><th class="n">Plan</th><th class="n">Actual</th>
          <th class="n">Variance</th><th class="n">Tickets</th><th class="n">Purchase value</th></tr></thead>
        <tbody>
          ${groups.map(g => `<tr>
            <td>${g.supply === "PURCHASED" ? "Purchased cane" : "Own estate"}</td>
            <td class="n">${q(g.plan)}</td>
            <td class="n">${q(g.actual)}</td>
            <td class="n ${g.variance === null ? "" : g.variance < -5 ? "bad" : g.variance > 5 ? "warn" : "good"}">
              ${g.variance === null ? '<span class="na">n/a</span>' : pct.format(g.variance) + " %"}</td>
            <td class="n">${g.tickets}</td>
            <td class="n">${g.value === null ? '<span class="na">n/a</span>' : q(g.value) + " USD"}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div class="body">
      <p class="hint">Own-estate cane shows no purchase value because it was never
        bought — that is an absent number, not a zero. Cane delivered against no
        plan at all would show <span class="na">n/a</span> for variance rather
        than a percentage invented from a zero plan.</p>
    </div>
  </div>`;
}

      <div class="kpi"><span class="eyebrow">Planned</span><span class="v">${q(totalPlan)}</span><span class="u">tonnes</span></div>
      <div class="kpi"><span class="eyebrow">Produced</span><span class="v">${q(totalActual)}</span><span class="u">tonnes</span></div>
      <div class="kpi"><span class="eyebrow">Variance</span>
        <span class="v" style="color:var(--${totalActual - totalPlan >= 0 ? "good" : "warn"})">${totalActual - totalPlan >= 0 ? "+" : ""}${q(totalActual - totalPlan)}</span>
        <span class="u">tonnes</span></div>
    </div>

    <div class="card">
      <header><h2>By material</h2>
        <span class="chip ${version ? "good" : "mute"}">${version ? `V${version.no} · ${version.status}` : "no approved version"}</span>
      </header>
      <div class="scroll">
        <table>
          <thead><tr>
            <th>Material</th><th class="n">Plan</th><th class="n">Actual</th>
            <th class="n">Variance</th><th class="n">Variance %</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${esc(matByCode(r.code).name)}</td>
                <td class="n">${q(r.plan)}</td>
                <td class="n">${q(r.actual)}</td>
                <td class="n">${r.variance >= 0 ? "+" : ""}${q(r.variance)}</td>
                <td class="n"><span class="chip ${state_(r.vp)}">${r.vp === null ? "n/a" : (r.vp >= 0 ? "+" : "") + pct.format(r.vp) + "%"}</span></td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <header><h3>Reading it</h3></header>
      <div class="body">
        <ul class="tight">
          <li><b>Electricity</b> was generated but never planned, so its variance has no percentage. Showing 0 % or 100 % there would both be wrong.</li>
          <li>Switch to company <b>2000</b>: it has an approved budget but nothing produced yet, so every line is a shortfall.</li>
        </ul>
      </div>
    </div>
  </div>`;
}

/* ── behaviour ─────────────────────────────────────────────────────── */

function recomputeTotals() {
  document.querySelectorAll("[data-grid]").forEach(grid => {
    const code = grid.dataset.grid;
    const lineIds = [...grid.querySelectorAll("[data-coltotal]")]
      .map(e => e.dataset.coltotal.split("|")[1]);
    let grand = 0;

    grid.querySelectorAll("[data-rowtotal]").forEach(cellEl => {
      const d = cellEl.dataset.rowtotal.split("|")[1];
      let t = 0;
      lineIds.forEach(l => {
        t += Number(grid.querySelector(`[data-cell="${d}|${l}|${code}"]`)?.value) || 0;
      });
      cellEl.textContent = q(t); grand += t;
    });

    lineIds.forEach(l => {
      let t = 0;
      DATES.forEach(d => {
        t += Number(grid.querySelector(`[data-cell="${d}|${l}|${code}"]`)?.value) || 0;
      });
      const el = grid.querySelector(`[data-coltotal="${code}|${l}"]`);
      if (el) el.textContent = q(t);
    });

    const g = grid.querySelector(`[data-grand="${code}"]`);
    if (g) g.textContent = q(grand);
  });
}

function recomputeHarvest() {
  const growerIds = [...document.querySelectorAll("[data-hcol]")].map(e => e.dataset.hcol);
  let grand = 0;

  document.querySelectorAll("[data-hrow]").forEach(cellEl => {
    const d = cellEl.dataset.hrow;
    let t = 0;
    growerIds.forEach(g => { t += Number(document.querySelector(`[data-hcell="${d}|${g}"]`)?.value) || 0; });
    cellEl.textContent = q(t); grand += t;
  });
  growerIds.forEach(g => {
    let t = 0;
    DATES.forEach(d => { t += Number(document.querySelector(`[data-hcell="${d}|${g}"]`)?.value) || 0; });
    const el = document.querySelector(`[data-hcol="${g}"]`);
    if (el) el.textContent = q(t);
  });
  const el = document.querySelector("[data-hgrand]");
  if (el) el.textContent = q(grand);
}

function wire() {
  document.querySelectorAll("[data-signin]").forEach(b => b.onclick = () => {
    state.user = USERS.find(u => u.username === b.dataset.signin);
    state.company = {}; state.log = []; render();
  });

  const out = document.querySelector("[data-signout]");
  if (out) out.onclick = () => { state.user = null; state.log = []; render(); };

  document.querySelectorAll("[data-screen]").forEach(b => b.onclick = () => {
    state.screen = b.dataset.screen; state.log = []; render();
  });

  document.querySelectorAll("[data-company]").forEach(sel => sel.onchange = () => {
    state.company[sel.dataset.company] = Number(sel.value);
    note("info", "company", `Now working in ${COMPANIES.find(c => c.id === Number(sel.value)).code}. What you may do here is re-evaluated for this company.`);
    render();
  });

  document.querySelectorAll("[data-msel]").forEach(sel => sel.onchange = () => {
    matrixSel[sel.dataset.msel] = sel.dataset.msel === "versionId" ? Number(sel.value) : sel.value;
    render();
  });

  document.querySelectorAll("[data-cell]").forEach(i => i.oninput = recomputeTotals);

  const save = document.querySelector("[data-save-matrix]");
  if (save) save.onclick = () => {
    const version = state.versions.find(v => v.id === matrixSel.versionId);
    if (!editableStatus(version.status)) {
      note("bad", "E-PLAN-007", `Planning version V${version.no} is ${version.status} and cannot be modified.`);
      return render();
    }

    // Everything on screen is validated before anything is written: a
    // rejected cell in the fourth product must not leave the first three
    // saved.
    const cells = [...document.querySelectorAll("[data-cell]")];
    const bad = cells.find(i => i.value !== "" && Number(i.value) < 0);
    if (bad) {
      note("bad", "E-VAL-001", "A planned quantity must not be negative. Nothing was saved — the whole grid is one transaction.");
      return render();
    }

    let written = 0, cleared = 0;
    const products = new Set();
    cells.forEach(i => {
      const key = i.dataset.cell;
      products.add(key.split("|")[2]);
      if (i.value === "") { if (key in version.items) { delete version.items[key]; cleared++; } }
      else { version.items[key] = Number(i.value); written++; }
    });
    note("good", "saved", `${written} cell${written === 1 ? "" : "s"} written across ${products.size} product${products.size === 1 ? "" : "s"}${cleared ? `, ${cleared} cleared` : ""}, in one transaction. An empty cell deletes the plan item rather than storing a zero.`);
    render();
  };

  document.querySelectorAll("[data-canetab]").forEach(b => b.onclick = () => {
    caneSel.tab = b.dataset.canetab; render();
  });
  document.querySelectorAll("[data-mastertab]").forEach(b => b.onclick = () => {
    masterTab = b.dataset.mastertab; render();
  });
  document.querySelectorAll("[data-csel]").forEach(sel => sel.onchange = () => {
    caneSel[sel.dataset.csel] = Number(sel.value); render();
  });

  document.querySelectorAll("[data-hcell]").forEach(i => i.oninput = recomputeHarvest);

  const saveHarvest = document.querySelector("[data-save-harvest]");
  if (saveHarvest) saveHarvest.onclick = () => {
    const version = state.versions.find(v => v.id === caneSel.versionId);
    if (!editableStatus(version.status)) {
      // The same rule and the same code as the production plan: one version,
      // one approval, one freeze.
      note("bad", "E-PLAN-007", `Planning version V${version.no} is ${version.status}, so the cane plan is frozen too.`);
      return render();
    }
    let written = 0, cleared = 0;
    document.querySelectorAll("[data-hcell]").forEach(i => {
      const key = i.dataset.hcell;
      if (i.value === "") { if (key in state.harvest) { delete state.harvest[key]; cleared++; } }
      else if (Number(i.value) < 0) { return; }
      else { state.harvest[key] = Number(i.value); written++; }
    });
    note("good", "saved", `${written} harvest cell${written === 1 ? "" : "s"} written${cleared ? `, ${cleared} cleared` : ""}.`);
    render();
  };

  const newTicket = document.querySelector("[data-new-ticket]");
  if (newTicket) newTicket.onclick = () => {
    const g = grower(3);
    state.deliveries.push({
      no: `CANE-1000-2026-${String(state.nextTicket++).padStart(6, "0")}`,
      date: TODAY, growerId: g.id, vehicle: "3EF-7788",
      gross: 420, tare: 14, ccs: 13.6, status: "DRAFT",
      price: g.price, currency: g.currency,
    });
    note("good", "weighed", "Ticket recorded as a draft. Net weight is derived from gross and tare; the price came from the grower's contract.");
    render();
  };

  document.querySelectorAll("[data-post-ticket]").forEach(b => b.onclick = () => {
    const ticket = state.deliveries[Number(b.dataset.postTicket)];
    const verdict = validatePosting({
      materialCode: "SUGARCANE", warehouseId: 11, movementTypeId: 2,
      processId: 1, quantity: netTons(ticket),
    });
    if (!verdict.ok) { note("bad", verdict.code, verdict.message); return render(); }

    addStock(11, "SUGARCANE", netTons(ticket));
    ticket.status = "POSTED";
    note("good", "posted", `${ticket.no} posted — ${q(netTons(ticket))} t of cane into the yard, through the same stock rules as everything else.`);
    render();
  });

  document.querySelectorAll("[data-transition]").forEach(b => b.onclick = () => {
    const [id, target] = b.dataset.transition.split("|");
    const v = state.versions.find(x => x.id === Number(id));

    if (target === "APPROVED" && v.createdBy === state.user.username) {
      note("bad", "E-PLAN-010", `Four eyes: ${state.user.name} created V${v.no} and may not also approve it.`);
      return render();
    }
    if (!TRANSITIONS[v.status].includes(target)) {
      note("bad", "E-PLAN-009", `A ${v.status} version cannot become ${target}.`);
      return render();
    }
    v.status = target;
    if (target === "APPROVED") v.approvedBy = state.user.username;
    note("good", target.toLowerCase(), `V${v.no} is now ${target}.`);
    render();
  });

  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const src = state.versions.find(x => x.id === Number(b.dataset.copy));
    const companyId = screenCompany("versions");
    const nextNo = Math.max(...state.versions.filter(v => v.companyId === companyId).map(v => v.no)) + 1;
    state.versions.push({
      id: state.nextVersionId++, companyId, no: nextNo,
      name: `${src.name} (copy)`, status: "DRAFT",
      createdBy: state.user.username, approvedBy: null, copiedFrom: src.id,
      items: JSON.parse(JSON.stringify(src.items)),      // a deep, independent snapshot
    });
    note("good", "copied", `V${nextNo} is an independent snapshot of V${src.no}. Editing it cannot change V${src.no}.`);
    render();
  });

  const nv = document.querySelector("[data-new-version]");
  if (nv) nv.onclick = () => {
    const companyId = screenCompany("versions");
    const existing = state.versions.filter(v => v.companyId === companyId);
    const nextNo = existing.length ? Math.max(...existing.map(v => v.no)) + 1 : 1;
    state.versions.push({
      id: state.nextVersionId++, companyId, no: nextNo, name: `Version ${nextNo}`,
      status: "DRAFT", createdBy: state.user.username, approvedBy: null, copiedFrom: null, items: {},
    });
    note("good", "created", `V${nextNo} created as DRAFT. Version numbering is open ended.`);
    render();
  };

  document.querySelectorAll("[data-post]").forEach(el => el.onchange = () => {
    const k = el.dataset.post;
    postSel[k] = ["warehouse","movementType","process","qty"].includes(k) ? Number(el.value) : el.value;
  });

  const doPost = document.querySelector("[data-do-post]");
  if (doPost) doPost.onclick = () => {
    const req = {
      materialCode: postSel.material, warehouseId: postSel.warehouse,
      movementTypeId: postSel.movementType,
      processId: postSel.process || null, quantity: Number(postSel.qty),
    };
    const problem = validatePosting(req);
    if (problem) { note("bad", problem.code, problem.text); return render(); }

    const t = mvt(req.movementTypeId);
    addStock(req.warehouseId, req.materialCode, t.dir === "IN" ? req.quantity : -req.quantity);
    state.actualByMaterial[req.materialCode] = (state.actualByMaterial[req.materialCode] || 0) + req.quantity;

    const no = `ACT-1000-${new Date().getUTCFullYear()}-${String(state.nextDoc++).padStart(6, "0")}`;
    state.documents.unshift({ no, date: TODAY, desc:
      `${mat(matByCode(req.materialCode).id).name} ${t.dir === "IN" ? "into" : "out of"} ${wh(req.warehouseId).code}`,
      status: "POSTED" });
    note("good", no, `${q(req.quantity)} t posted. Stock and the plan-versus-actual report have moved.`);
    render();
  };
}

render();
</script>
