server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# The API is proxied under the same origin, so the browser never makes a
	# cross-origin request and the CORS allowance stays narrow.
	location /api/ {
		proxy_pass         http://api:8080;
		proxy_http_version 1.1;
		proxy_set_header   Host              $host;
		proxy_set_header   X-Real-IP         $remote_addr;
		proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header   X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	# The application shell must not be cached; the UI5 resources it pulls are
	# versioned by their own URL.
	location = /index.html {
		add_header Cache-Control "no-store";
	}

	gzip on;
	gzip_types application/javascript application/json text/css text/xml text/plain;
}
