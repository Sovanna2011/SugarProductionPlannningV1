# Local stack: PostgreSQL, the Go API and the UI5 frontend.
#
#   docker compose up --build     → http://localhost:8081
#
# The credentials here are development defaults. Every real environment
# supplies its own values and its own JWT signing key (§A5).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sugar
      POSTGRES_PASSWORD: sugar
      POSTGRES_DB: sugar_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugar -d sugar_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: DEV
      HTTP_ADDR: ":8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: sugar
      DB_PASSWORD: sugar
      DB_NAME: sugar_dev
      DB_SSLMODE: disable
      DB_AUTO_MIGRATE: "true"
      MIGRATE_INCLUDE_DEMO: "true"
      JWT_SECRET: development-only-signing-key-change-me
      BOOTSTRAP_ADMIN_PASSWORD: "SugarPlanning#2026"
      DEMO_USER_PASSWORD: "SugarPlanning#2026"
      SEED_DEMO_USERS: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "8081:8080"

volumes:
  db-data:
